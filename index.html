<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RobloKick 2.0 ⚽</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden; }
canvas { display:block; cursor:crosshair; image-rendering:pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── SETUP ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900, H = 580;
canvas.width = W; canvas.height = H;
const scale = Math.min(window.innerWidth / W, window.innerHeight / H, 1.3);
canvas.style.transform = `scale(${scale})`;
canvas.style.transformOrigin = 'center center';

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = typeof r==='number'?r:0;
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r); this.arcTo(x+w,y+h,x+w-r,y+h,r);
    this.lineTo(x+r,y+h); this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r); this.arcTo(x,y,x+r,y,r);
    this.closePath(); return this;
  };
}

// ── AUDIO ──────────────────────────────────────────────────────────────────
let AC = null;
function initAC(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); }
document.addEventListener('keydown', initAC, {once:true});
document.addEventListener('click', initAC, {once:true});

function beep(freq, type, vol, dur, freqEnd){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=type||'sine'; o.frequency.value=freq;
  if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.3, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur+0.01);
}
function sndKick(){ beep(180,'triangle',0.5,0.08,55); }
function sndBounce(){ beep(260,'sine',0.12,0.06,100); }
function sndWhistle(){ beep(2500,'sine',0.25,0.12,2700); setTimeout(()=>beep(2300,'sine',0.2,0.1),120); }
function sndGoal(){
  if(!AC) return;
  for(let i=0;i<3;i++) setTimeout(()=>{ beep(880,'sawtooth',0.18,0.4,440); },i*80);
  // Crowd noise
  const buf=AC.createBuffer(1,AC.sampleRate*0.7,AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.25;
  const src=AC.createBufferSource(); src.buffer=buf;
  const bpf=AC.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=700;
  const g=AC.createGain();
  src.connect(bpf); bpf.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(1,AC.currentTime+0.15);
  g.gain.linearRampToValueAtTime(0,AC.currentTime+0.7);
  src.start(); src.stop(AC.currentTime+0.8);
}

// ── CONSTANTS ───────────────────────────────────────────────────────────────
const F = {x:70, y:70, w:760, h:440};
const GW=28, GH=130, GY=(H-GH)/2;
const WIN=3;

// ── STATE ───────────────────────────────────────────────────────────────────
let gs='playing'; // playing | goal | won | lost
let pScore=0, cScore=0;
let goalBy='', goalTimer=0;
let shake={x:0,y:0,t:0};
let fws=[],parts=[],drops=[];
let tT=0; // trophy time

// ── INPUT ───────────────────────────────────────────────────────────────────
const keys={};
const mouse={x:W/2,y:H/2};
document.addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space') e.preventDefault();});
document.addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code==='Space'&&gs==='playing') releaseKick(); });
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('click',()=>{ initAC(); if(gs==='playing') clickKick(); else checkRestart(); });

// ── ENTITIES ────────────────────────────────────────────────────────────────
const P={x:0,y:0,w:26,h:40,spd:5.2,
  bc:'#E83A3A',hc:'#CC1111',pc:'#1a1a55',
  kcd:0,power:0,charging:false,kicking:false,kanim:0,
  moving:false,step:0,dir:{x:1,y:0}};
const C={x:0,y:0,w:26,h:40,spd:3.6,
  bc:'#3A6AE8',hc:'#1144CC',pc:'#441100',
  kcd:0,kicking:false,kanim:0,
  moving:false,step:0,dir:{x:-1,y:0},
  ai:'chase',think:0};
const B={x:0,y:0,r:12,vx:0,vy:0,spin:0,fr:0.977,trail:[]};

function reset(by){
  P.x=F.x+170; P.y=H/2; P.power=0; P.charging=false; P.kicking=false;
  C.x=F.x+F.w-170; C.y=H/2;
  B.x=W/2; B.y=H/2; B.vx=(by==='cpu'?-2.5:2.5); B.vy=0; B.spin=0; B.trail=[];
}
function fullReset(){
  pScore=0; cScore=0; gs='playing'; fws=[]; parts=[]; drops=[];
  reset(null);
}

// ── CROWD ───────────────────────────────────────────────────────────────────
const crowd=[];
(function initCrowd(){
  function addRow(y, dir){ for(let x=30;x<W-30;x+=22) crowd.push({x:x+(Math.random()-0.5)*7,y:y+(dir?1:-1)*(Math.random()*8),c:`hsl(${Math.random()*360},65%,52%)`,s:9+Math.random()*5,ph:Math.random()*Math.PI*2}); }
  for(let r=0;r<3;r++) addRow(F.y-14-r*17, false);
  for(let r=0;r<3;r++) addRow(F.y+F.h+14+r*17, true);
})();

// ── DRAW: STADIUM ───────────────────────────────────────────────────────────
function drawStadium(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#120228'); bg.addColorStop(1,'#060112');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Stadium lights
  [[60,45],[W-60,45],[60,H-45],[W-60,H-45]].forEach(([lx,ly])=>{
    const g=ctx.createRadialGradient(lx,ly,0,lx,ly,220);
    g.addColorStop(0,'rgba(255,245,200,0.22)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFFBE0'; ctx.beginPath(); ctx.arc(lx,ly,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#555'; ctx.fillRect(lx-3,ly+7,6,16);
  });

  // Stand backgrounds
  ctx.fillStyle='#18183a'; ctx.fillRect(0,0,W,F.y-2);
  ctx.fillStyle='#18183a'; ctx.fillRect(0,F.y+F.h+2,W,H-(F.y+F.h+2));

  // Crowd
  crowd.forEach(p=>{
    p.ph+=0.025;
    const bob=Math.sin(p.ph)*2.5;
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(p.x,p.y+bob+p.s*0.55,p.s*0.48,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y+bob,p.s*0.44,0,Math.PI*2); ctx.fill();
  });
}

// ── DRAW: FIELD ─────────────────────────────────────────────────────────────
function drawField(){
  for(let i=0;i<10;i++){
    ctx.fillStyle=i%2===0?'#2B8A2B':'#248024';
    ctx.fillRect(F.x+i*(F.w/10),F.y,F.w/10,F.h);
  }
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.88)'; ctx.lineWidth=2.5;
  ctx.strokeRect(F.x,F.y,F.w,F.h);
  ctx.beginPath(); ctx.moveTo(W/2,F.y); ctx.lineTo(W/2,F.y+F.h); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,68,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(W/2,H/2,4,0,Math.PI*2); ctx.fill();

  // Penalty boxes
  const pb=140, pd=115;
  ctx.strokeRect(F.x,H/2-pb/2,pd,pb);
  ctx.strokeRect(F.x+F.w-pd,H/2-pb/2,pd,pb);
  ctx.strokeRect(F.x,H/2-58,52,116);
  ctx.strokeRect(F.x+F.w-52,H/2-58,52,116);
  ctx.beginPath(); ctx.arc(F.x+pd,H/2,58,-Math.PI*0.58,Math.PI*0.58); ctx.stroke();
  ctx.beginPath(); ctx.arc(F.x+F.w-pd,H/2,58,Math.PI*0.42,Math.PI*1.58); ctx.stroke();

  // Spots
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(F.x+78,H/2,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(F.x+F.w-78,H/2,4,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Goals
  [F.x, F.x+F.w].forEach((gx,i)=>{
    const nx=i===0?gx-GW:gx;
    ctx.fillStyle='rgba(200,200,200,0.15)'; ctx.fillRect(nx,GY,GW,GH);
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1;
    for(let r=0;r<=5;r++){ctx.beginPath();ctx.moveTo(nx,GY+r*GH/5);ctx.lineTo(nx+GW,GY+r*GH/5);ctx.stroke();}
    for(let c=0;c<=3;c++){ctx.beginPath();ctx.moveTo(nx+c*GW/3,GY);ctx.lineTo(nx+c*GW/3,GY+GH);ctx.stroke();}
    ctx.fillStyle='#E8E8E8';
    ctx.fillRect(gx-2,GY-5,4,GH+10);
    ctx.fillRect(nx-1,GY-5,GW+2,7);
    ctx.fillRect(nx-1,GY+GH-2,GW+2,7);
  });
}

// ── DRAW: CHARACTER ─────────────────────────────────────────────────────────
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function tint(h,a){ const [r,g,b]=hex2rgb(h); return `rgb(${Math.min(255,r+a)|0},${Math.min(255,g+a)|0},${Math.min(255,b+a)|0})`; }

function drawChar(ent, isP){
  const {x,y,w,h,bc,hc,pc,kicking,kanim,moving,step} = ent;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x,y+h/2+5,w*0.6,6,0,0,Math.PI*2); ctx.fill();

  const ls = moving?Math.sin(step)*9:0;

  // Legs
  ctx.fillStyle=pc;
  ctx.save(); ctx.translate(x-w*0.14,y+h*0.12); ctx.rotate(ls*0.28);
  ctx.fillRect(-w*0.21,0,w*0.4,h*0.34); ctx.restore();
  ctx.save(); ctx.translate(x+w*0.14,y+h*0.12); ctx.rotate(-ls*0.28);
  ctx.fillRect(-w*0.19,0,w*0.4,h*0.34); ctx.restore();
  // Shoes
  ctx.fillStyle='#111';
  ctx.fillRect(x-w*0.37,y+h*0.43,w*0.42,h*0.1);
  ctx.fillRect(x-w*0.05,y+h*0.43,w*0.42,h*0.1);

  // Body
  const bg=ctx.createLinearGradient(x-w/2,y-h*0.25,x+w/2,y+h*0.1);
  bg.addColorStop(0,tint(bc,30)); bg.addColorStop(1,tint(bc,-15));
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.roundRect(x-w/2,y-h*0.25,w,h*0.38,3); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(x-w*0.09,y-h*0.25,w*0.18,h*0.38);
  // Number
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font=`bold ${w*0.35}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(isP?'1':'9',x,y-h*0.06);

  // Arms
  const as=moving?Math.sin(step+Math.PI)*0.35:0;
  const ar=ctx.createLinearGradient(x-w*0.8,0,x,0);
  ar.addColorStop(0,tint(bc,-15)); ar.addColorStop(1,tint(bc,20));
  ctx.fillStyle=ar;
  ctx.save(); ctx.translate(x-w/2,y-h*0.18); ctx.rotate(-as);
  ctx.fillRect(-w*0.3,0,w*0.3,h*0.3); ctx.restore();
  ctx.save(); ctx.translate(x+w/2,y-h*0.18); ctx.rotate(as);
  ctx.fillRect(0,0,w*0.3,h*0.3); ctx.restore();
  // Hands
  ctx.fillStyle='#F5CBA7';
  ctx.beginPath(); ctx.arc(x-w*0.64,y-h*0.02,w*0.12,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*0.64,y-h*0.02,w*0.12,0,Math.PI*2); ctx.fill();

  // Kick anim leg
  if(kicking&&kanim>0){
    const kd=isP?(mouse.x>x?1:-1):(ent.dir.x>=0?1:-1);
    ctx.fillStyle=pc;
    ctx.save(); ctx.translate(x+kd*w*0.2,y+h*0.12); ctx.rotate(kd*0.85);
    ctx.fillRect(-w*0.2,0,w*0.42,h*0.38);
    ctx.fillStyle='#111'; ctx.fillRect(-w*0.24,h*0.36,w*0.5,h*0.12);
    ctx.restore();
  }

  // ── HEAD (Big Roblox square head) ──
  const hw=w*0.9, hh=h*0.4;
  const hx=x-hw/2, hy=y-h*0.68;

  const hg=ctx.createLinearGradient(hx,hy,hx+hw,hy+hh);
  hg.addColorStop(0,'#FDDDB5'); hg.addColorStop(0.6,'#F5CBA7'); hg.addColorStop(1,'#E0A882');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.roundRect(hx,hy,hw,hh,4); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(hx,hy,hw,hh,4); ctx.stroke();

  // Eyes
  const ew=hw*0.28, eh=hh*0.38;
  [[hx+hw*0.09,hy+hh*0.2],[hx+hw*0.63,hy+hh*0.2]].forEach(([ex,ey])=>{
    ctx.fillStyle='white'; ctx.fillRect(ex,ey,ew,eh);
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(ex+ew*0.22,ey+eh*0.18,ew*0.55,eh*0.65);
    ctx.fillStyle='white'; ctx.fillRect(ex+ew*0.22,ey+eh*0.18,ew*0.24,eh*0.28);
  });
  // Smile
  ctx.strokeStyle='#7B3F10'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(hx+hw*0.25,hy+hh*0.72);
  ctx.quadraticCurveTo(hx+hw*0.5,hy+hh*0.9,hx+hw*0.75,hy+hh*0.72);
  ctx.stroke();

  // Hat
  ctx.fillStyle=hc; ctx.fillRect(hx-2,hy-11,hw+4,14);
  ctx.fillStyle=tint(hc,-20); ctx.fillRect(hx-5,hy+1,hw+10,5);
  // Team stripe on hat
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(hx+hw*0.3,hy-11,hw*0.4,14);

  // Label
  ctx.fillStyle='rgba(255,255,255,0.75)'; ctx.font='bold 10px Arial'; ctx.textAlign='center';
  ctx.fillText(isP?'DU':'CPU',x,hy-15);
}

// ── DRAW: BALL ───────────────────────────────────────────────────────────────
function drawBall(){
  const {x,y,r,spin,vx,vy}=B;
  const spd=Math.sqrt(vx*vx+vy*vy);

  // Trail
  if(spd>3.5) B.trail.push({x,y,a:1});
  B.trail=B.trail.filter(t=>t.a>0);
  B.trail.forEach(t=>{
    ctx.globalAlpha=t.a*0.3;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(t.x,t.y,r*t.a*0.7,0,Math.PI*2); ctx.fill();
    t.a-=0.1;
  });
  ctx.globalAlpha=1;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(x,y+r+4,r*0.85,5,0,0,Math.PI*2); ctx.fill();

  ctx.save(); ctx.translate(x,y); ctx.rotate(spin);
  const gr=ctx.createRadialGradient(-r*0.3,-r*0.35,0,0,0,r);
  gr.addColorStop(0,'#fff'); gr.addColorStop(0.65,'#e8e8e8'); gr.addColorStop(1,'#b8b8b8');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  // Pentagons
  ctx.fillStyle='#222';
  ctx.beginPath();
  for(let i=0;i<5;i++){ const a=(i/5)*Math.PI*2-Math.PI/2, d=r*0.38; i?ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d):ctx.moveTo(Math.cos(a)*d,Math.sin(a)*d); }
  ctx.closePath(); ctx.fill();
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2-Math.PI/2, d=r*0.76;
    ctx.save(); ctx.translate(Math.cos(a)*d,Math.sin(a)*d); ctx.rotate(a+Math.PI/2);
    ctx.beginPath();
    for(let j=0;j<5;j++){ const ba=(j/5)*Math.PI*2-Math.PI/2, br=r*0.21; j?ctx.lineTo(Math.cos(ba)*br,Math.sin(ba)*br):ctx.moveTo(Math.cos(ba)*br,Math.sin(ba)*br); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.strokeStyle='rgba(60,60,60,0.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  // Gloss
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.beginPath(); ctx.ellipse(-r*0.26,-r*0.3,r*0.22,r*0.12,-0.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── DRAW: HUD ────────────────────────────────────────────────────────────────
function drawHUD(){
  // Scoreboard
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.roundRect(W/2-145,8,290,58,10); ctx.fill();
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2; ctx.beginPath(); ctx.roundRect(W/2-145,8,290,58,10); ctx.stroke();
  ctx.fillStyle='#E83A3A'; ctx.font='bold 12px Arial'; ctx.textAlign='right'; ctx.fillText('DU',W/2-52,27);
  ctx.fillStyle='#3A6AE8'; ctx.textAlign='left'; ctx.fillText('CPU',W/2+52,27);
  ctx.fillStyle='#E83A3A'; ctx.font='bold 34px Arial'; ctx.textAlign='right'; ctx.fillText(pScore,W/2-20,58);
  ctx.fillStyle='#FFD700'; ctx.textAlign='center'; ctx.fillText(':',W/2,54);
  ctx.fillStyle='#3A6AE8'; ctx.textAlign='left'; ctx.fillText(cScore,W/2+20,58);
  // Win dots
  for(let i=0;i<WIN;i++){
    ctx.fillStyle=i<pScore?'#E83A3A':'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(W/2-100+i*20,54,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=i<cScore?'#3A6AE8':'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(W/2+100-i*20,54,5,0,Math.PI*2); ctx.fill();
  }
  // Controls
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='11px Arial'; ctx.textAlign='center';
  ctx.fillText('WASD bewegen · SPACE gedrückt halten & loslassen zum Schießen · Maus zum Zielen',W/2,H-7);

  // Power bar + aim arrow
  if(P.charging && P.power>0){
    const pct=Math.min(P.power/65,1);
    const ax=mouse.x-P.x, ay=mouse.y-P.y, al=Math.sqrt(ax*ax+ay*ay);
    if(al>0){
      const nx=ax/al, ny=ay/al;
      const col=pct<0.5?'rgba(80,255,80,0.85)':pct<0.8?'rgba(255,220,0,0.85)':'rgba(255,50,50,0.85)';
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.setLineDash([7,5]);
      ctx.beginPath(); ctx.moveTo(P.x+nx*14,P.y+ny*14); ctx.lineTo(P.x+nx*85,P.y+ny*85); ctx.stroke();
      ctx.setLineDash([]);
      const tip={x:P.x+nx*95,y:P.y+ny*95}, perp={x:-ny,y:nx};
      ctx.fillStyle=col; ctx.beginPath();
      ctx.moveTo(tip.x,tip.y); ctx.lineTo(tip.x-nx*13+perp.x*7,tip.y-ny*13+perp.y*7);
      ctx.lineTo(tip.x-nx*13-perp.x*7,tip.y-ny*13-perp.y*7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const bx=P.x, by=P.y-P.h/2-22, bw=64, bh=10;
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(bx-bw/2-2,by-2,bw+4,bh+4,4); ctx.fill();
    const bc2=pct<0.5?'#44ff44':pct<0.8?'#ffcc00':'#ff4444';
    ctx.fillStyle=bc2; ctx.beginPath(); ctx.roundRect(bx-bw/2,by,bw*pct,bh,3); ctx.fill();
    ctx.strokeStyle='white'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(bx-bw/2-2,by-2,bw+4,bh+4,4); ctx.stroke();
    ctx.fillStyle='white'; ctx.font='bold 9px Arial'; ctx.textAlign='center'; ctx.fillText('POWER',bx,by-4);
  }
}

// ── EFFECTS ──────────────────────────────────────────────────────────────────
function spawnFW(x,y){
  const cols=['#FF4444','#FFD700','#44FF88','#66AAFF','#FF88FF','#FF8844','#fff','#88FFFF'];
  const c=cols[Math.floor(Math.random()*cols.length)];
  for(let i=0;i<32;i++){
    const a=(i/32)*Math.PI*2, s=3+Math.random()*7;
    fws.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c,sz:2.5+Math.random()*3});
  }
}
function burstGoal(){
  const cols=['#FFD700','#FF4444','#44FF88','#66AAFF','#FF88FF','#fff'];
  for(let i=0;i<110;i++){
    parts.push({x:W/2+(Math.random()-0.5)*440,y:H/2+(Math.random()-0.5)*280,
      vx:(Math.random()-0.5)*11,vy:(Math.random()-0.5)*11-6,
      l:1,sz:5+Math.random()*10,c:cols[i%cols.length],r:Math.random()*Math.PI*2,rv:(Math.random()-0.5)*0.4});
  }
}
function updateEffects(){
  fws.forEach(f=>{ f.x+=f.vx;f.y+=f.vy;f.vy+=0.13;f.vx*=0.985;f.vy*=0.985;f.l-=0.016; });
  fws=fws.filter(f=>f.l>0);
  parts.forEach(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.vx*=0.93;p.vy*=0.94;p.r+=p.rv;p.l-=0.017; });
  parts=parts.filter(p=>p.l>0);
  drops.forEach(d=>{ d.y+=d.vy;d.x+=d.vx;d.r+=d.rv; if(d.y>H+70){d.y=-70;d.x=Math.random()*W;} });
}
function drawEffects(){
  fws.forEach(f=>{ ctx.globalAlpha=f.l*f.l; ctx.fillStyle=f.c; ctx.shadowBlur=8;ctx.shadowColor=f.c; ctx.beginPath();ctx.arc(f.x,f.y,f.sz,0,Math.PI*2);ctx.fill(); });
  ctx.shadowBlur=0;
  parts.forEach(p=>{ ctx.globalAlpha=p.l; ctx.fillStyle=p.c; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);ctx.restore(); });
  ctx.globalAlpha=1;
}

// ── SCREENS ──────────────────────────────────────────────────────────────────
function drawGoalScreen(){
  ctx.fillStyle='rgba(0,0,0,0.52)'; ctx.fillRect(0,0,W,H);
  const p=0.88+Math.sin(Date.now()/90)*0.12;
  ctx.save(); ctx.translate(W/2,H/2-18); ctx.scale(p,p);
  ctx.strokeStyle='#FF8C00'; ctx.lineWidth=6; ctx.font='bold 86px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeText('⚽ TOR! ⚽',0,0);
  ctx.fillStyle='#FFD700'; ctx.fillText('⚽ TOR! ⚽',0,0);
  ctx.restore();
  ctx.fillStyle='white'; ctx.font='bold 26px Arial'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillText(goalBy==='player'?'🔴 Dein Treffer! Gut gemacht!':'🔵 CPU-Tor! Zurück kämpfen!',W/2,H/2+55);
  if(Math.random()<0.18) spawnFW(Math.random()*W,Math.random()*H*0.65);
}

function drawWinScreen(){
  tT+=0.04;
  ctx.fillStyle='rgba(0,0,15,0.92)'; ctx.fillRect(0,0,W,H);
  // Rays
  ctx.save(); ctx.translate(W/2,H/2);
  for(let i=0;i<12;i++){
    const a=tT*0.25+(i/12)*Math.PI*2;
    ctx.fillStyle=`rgba(255,210,0,${0.035+Math.sin(tT*1.5+i)*0.018})`;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*700,Math.sin(a)*700); ctx.lineTo(Math.cos(a+0.18)*700,Math.sin(a+0.18)*700); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // Drops
  drops.forEach(d=>{
    ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.r);
    ctx.font=`${d.sz}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=0.88; ctx.fillText(d.e,0,0); ctx.restore(); ctx.globalAlpha=1;
  });
  // Trophy
  ctx.font='86px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🏆',W/2,H/2-125+Math.sin(tT)*13);
  // Title
  const grd=ctx.createLinearGradient(W/2-260,0,W/2+260,0);
  grd.addColorStop(0,'#FF6B00'); grd.addColorStop(0.4,'#FFD700'); grd.addColorStop(0.6,'#FFFFA0'); grd.addColorStop(1,'#FF6B00');
  ctx.fillStyle=grd; ctx.font='bold 54px Arial'; ctx.textBaseline='alphabetic';
  ctx.fillText('DU HAST GEWONNEN!',W/2,H/2-35);
  // Surprise box
  ctx.fillStyle='rgba(255,215,0,0.1)'; ctx.beginPath(); ctx.roundRect(W/2-320,H/2+5,640,88,14); ctx.fill();
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.roundRect(W/2-320,H/2+5,640,88,14); ctx.stroke();
  ctx.fillStyle='#FFD700'; ctx.font='bold 16px Arial'; ctx.textAlign='center';
  ctx.fillText('🎁 ÜBERRASCHUNG: Du wurdest zum Roblox-Fußball-Weltmeister gekrönt! 👑',W/2,H/2+38);
  ctx.fillStyle='rgba(255,255,200,0.88)'; ctx.font='13px Arial';
  ctx.fillText('Dein RobloKick-Avatar tritt jetzt für das All-Star-Team an — du bist eine Legende! 🌟⚽🏆',W/2,H/2+68);
  ctx.fillStyle='white'; ctx.font='bold 20px Arial'; ctx.fillText(`Endstand: ${pScore} : ${cScore}`,W/2,H/2+110);
  // Button
  const bx=W/2,by=H/2+152, ov=mouse.x>bx-118&&mouse.x<bx+118&&mouse.y>by-27&&mouse.y<by+27;
  ctx.save(); ctx.translate(bx,by); if(ov) ctx.scale(1.06,1.06);
  const bbg=ctx.createLinearGradient(-118,-27,118,27);
  bbg.addColorStop(0,'#22c55e'); bbg.addColorStop(1,'#15803d');
  ctx.fillStyle=bbg; ctx.shadowBlur=ov?28:10; ctx.shadowColor='#22c55e';
  ctx.beginPath(); ctx.roundRect(-118,-27,236,54,12); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='white'; ctx.font='bold 21px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🔄 NOCHMAL SPIELEN',0,0); ctx.restore();
  drawEffects();
  if(Math.random()<0.1) spawnFW(Math.random()*W,Math.random()*H*0.52);
}

function drawLoseScreen(){
  ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);
  ctx.font='76px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('😤',W/2,H/2-95);
  ctx.fillStyle='#FF4444'; ctx.font='bold 54px Arial'; ctx.textBaseline='alphabetic'; ctx.fillText('NIEDERLAGE!',W/2,H/2-22);
  ctx.fillStyle='#aaa'; ctx.font='21px Arial'; ctx.fillText('Die CPU war zu stark — trainiere und komm wieder! 💪',W/2,H/2+25);
  ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.font='18px Arial'; ctx.fillText(`Endstand: ${pScore} : ${cScore}`,W/2,H/2+62);
  const bx=W/2,by=H/2+120, ov=mouse.x>bx-118&&mouse.x<bx+118&&mouse.y>by-27&&mouse.y<by+27;
  ctx.save(); ctx.translate(bx,by); if(ov) ctx.scale(1.06,1.06);
  const bbg=ctx.createLinearGradient(-118,-27,118,27); bbg.addColorStop(0,'#3B82F6'); bbg.addColorStop(1,'#1D4ED8');
  ctx.fillStyle=bbg; ctx.shadowBlur=ov?28:10; ctx.shadowColor='#3B82F6';
  ctx.beginPath(); ctx.roundRect(-118,-27,236,54,12); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='white'; ctx.font='bold 20px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🔄 NOCHMAL VERSUCHEN',0,0); ctx.restore();
}

function checkRestart(){
  const bx=W/2;
  const by=gs==='won'?H/2+152:H/2+120;
  if(mouse.x>bx-118&&mouse.x<bx+118&&mouse.y>by-27&&mouse.y<by+27) fullReset();
}

// ── KICK ─────────────────────────────────────────────────────────────────────
function doKick(pwr){
  const dx=B.x-P.x, dy=B.y-P.y, dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>58||P.kcd>0) return;
  const ax=mouse.x-P.x, ay=mouse.y-P.y, al=Math.sqrt(ax*ax+ay*ay);
  const nx=al>0?ax/al:dx/Math.max(dist,1), ny=al>0?ay/al:dy/Math.max(dist,1);
  const spd=Math.max(7,pwr*0.21+5);
  B.vx=nx*spd; B.vy=ny*spd; B.spin+=nx*0.9; B.lastTouch='player';
  P.kcd=24; P.kicking=true; P.kanim=20;
  sndKick();
  for(let i=0;i<8;i++) parts.push({x:B.x,y:B.y,vx:(Math.random()-0.5)*9,vy:(Math.random()-0.5)*9-4,l:0.75,sz:6,c:'#FFD700',r:0,rv:0});
}
function releaseKick(){ if(P.charging){ doKick(P.power); } P.power=0; P.charging=false; }
function clickKick(){ doKick(30); }

// ── UPDATE: PLAYER ────────────────────────────────────────────────────────────
function updPlayer(){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA']) dx-=1;
  if(keys['ArrowRight']||keys['KeyD']) dx+=1;
  if(keys['ArrowUp']||keys['KeyW']) dy-=1;
  if(keys['ArrowDown']||keys['KeyS']) dy+=1;
  const l=Math.sqrt(dx*dx+dy*dy); if(l>0){dx/=l;dy/=l;}
  P.x+=dx*P.spd; P.y+=dy*P.spd;
  P.moving=l>0; if(P.moving) P.step+=0.2;
  if(dx!==0) P.dir={x:dx,y:dy};
  P.x=Math.max(F.x+P.w/2,Math.min(F.x+F.w-P.w/2,P.x));
  P.y=Math.max(F.y+P.h/2,Math.min(F.y+F.h-P.h/2,P.y));
  if(keys['Space']){ P.charging=true; P.power=Math.min(P.power+2,70); }
  if(P.kcd>0) P.kcd--;
  if(P.kanim>0){ P.kanim--; if(!P.kanim) P.kicking=false; }
  pushB(P);
}

// ── UPDATE: CPU AI ────────────────────────────────────────────────────────────
function updCPU(){
  C.think--;
  if(C.think<=0){
    C.think=18+Math.random()*14;
    const dB=Math.hypot(B.x-C.x,B.y-C.y), pB=Math.hypot(B.x-P.x,B.y-P.y);
    C.ai = dB<pB*1.25 ? (B.x<W/2?'defend':'attack') : 'position';
  }
  let tx=B.x+B.vx*4, ty=B.y+B.vy*4;
  if(C.ai==='defend'){ tx=(B.x+F.x+GW)*0.5; ty=(B.y+H/2)*0.5; }
  if(C.ai==='position'){ tx=F.x+F.w*0.62; ty=H/2; }
  const cdx=tx-C.x, cdy=ty-C.y, cd=Math.hypot(cdx,cdy);
  if(cd>4){ C.x+=cdx/cd*C.spd*(0.85+Math.random()*0.3); C.y+=cdy/cd*C.spd*(0.85+Math.random()*0.3); C.moving=true; C.step+=0.17; C.dir={x:cdx/cd,y:cdy/cd}; }
  else C.moving=false;
  C.x=Math.max(F.x+C.w/2,Math.min(F.x+F.w-C.w/2,C.x));
  C.y=Math.max(F.y+C.h/2,Math.min(F.y+F.h-C.h/2,C.y));
  // CPU kick
  const db=Math.hypot(B.x-C.x,B.y-C.y);
  if(db<48&&C.kcd===0){
    const gx=F.x+GW/2, gy=H/2+(Math.random()-0.5)*GH*0.55;
    const gl=Math.hypot(gx-B.x,gy-B.y), spd=7+Math.random()*5.5;
    B.vx=(gx-B.x)/gl*spd; B.vy=(gy-B.y)/gl*spd; B.spin-=0.6; B.lastTouch='cpu';
    C.kcd=26; C.kicking=true; C.kanim=18; sndKick();
  }
  if(C.kcd>0) C.kcd--;
  if(C.kanim>0){ C.kanim--; if(!C.kanim) C.kicking=false; }
  pushB(C);
}

// ── UPDATE: BALL ──────────────────────────────────────────────────────────────
function updBall(){
  B.x+=B.vx; B.y+=B.vy; B.vx*=B.fr; B.vy*=B.fr; B.spin*=0.965;
  B.spin+=Math.sqrt(B.vx*B.vx+B.vy*B.vy)*0.012*Math.sign(B.vx);

  if(B.x-B.r<=F.x){
    if(B.y>GY&&B.y<GY+GH){ cScore++; goalBy='cpu'; goalTimer=105; gs='goal'; burstGoal(); for(let i=0;i<5;i++) spawnFW(F.x+50+Math.random()*80,GY+Math.random()*GH); sndGoal(); return; }
    B.x=F.x+B.r+1; B.vx*=-0.62; B.spin*=-0.5; sndBounce();
  }
  if(B.x+B.r>=F.x+F.w){
    if(B.y>GY&&B.y<GY+GH){ pScore++; goalBy='player'; goalTimer=105; gs='goal'; burstGoal(); for(let i=0;i<5;i++) spawnFW(F.x+F.w-50-Math.random()*80,GY+Math.random()*GH); sndGoal(); return; }
    B.x=F.x+F.w-B.r-1; B.vx*=-0.62; B.spin*=-0.5; sndBounce();
  }
  if(B.y-B.r<=F.y){ B.y=F.y+B.r+1; B.vy*=-0.62; sndBounce(); }
  if(B.y+B.r>=F.y+F.h){ B.y=F.y+F.h-B.r-1; B.vy*=-0.62; sndBounce(); }
}

function pushB(e){
  const dx=B.x-e.x, dy=B.y-e.y, d=Math.hypot(dx,dy), min=e.w/2+B.r+1;
  if(d<min&&d>0){
    const nx=dx/d, ny=dy/d;
    B.x=e.x+nx*(min+0.5); B.y=e.y+ny*(min+0.5);
    const dot=B.vx*nx+B.vy*ny; if(dot<0){B.vx-=dot*nx*1.15;B.vy-=dot*ny*1.15;}
    B.spin+=nx*0.22;
  }
}

// ── SHAKE ─────────────────────────────────────────────────────────────────────
function applyShake(){
  if(shake.t>0.3){ ctx.translate((Math.random()-0.5)*shake.t*2,(Math.random()-0.5)*shake.t*2); shake.t*=0.82; }
}

// ── WIN/LOSE SETUP ────────────────────────────────────────────────────────────
function setupWin(){
  gs='won'; shake.t=14; sndWhistle();
  drops=[];
  const em=['🏆','⭐','🌟','🎁','🎉','🎊','🔥','💎','👑','🎯','⚡','🌈'];
  for(let i=0;i<28;i++) drops.push({x:Math.random()*W,y:-80-Math.random()*450,vx:(Math.random()-0.5)*2.5,vy:1.2+Math.random()*2.5,r:Math.random()*Math.PI*2,rv:(Math.random()-0.5)*0.1,sz:22+Math.random()*28,e:em[Math.floor(Math.random()*em.length)]});
  for(let i=0;i<12;i++) spawnFW(Math.random()*W,Math.random()*H*0.5);
}
function setupLose(){ gs='lost'; shake.t=8; sndWhistle(); }

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.save(); applyShake();

  drawStadium(); drawField();
  updateEffects();

  if(gs==='playing'){
    updPlayer(); updCPU(); updBall();
    if(pScore>=WIN) setupWin();
    else if(cScore>=WIN) setupLose();
    drawChar(P,true); drawChar(C,false); drawBall(); drawEffects(); drawHUD();
  }
  else if(gs==='goal'){
    drawChar(P,true); drawChar(C,false); drawBall(); drawEffects(); drawHUD(); drawGoalScreen();
    goalTimer--;
    if(goalTimer<=0){ gs='playing'; parts=[]; reset(goalBy); if(pScore>=WIN) setupWin(); else if(cScore>=WIN) setupLose(); }
  }
  else if(gs==='won'){ drawWinScreen(); }
  else if(gs==='lost'){ drawLoseScreen(); }

  ctx.restore();
  requestAnimationFrame(loop);
}

reset(null); sndWhistle(); loop();
</script>
